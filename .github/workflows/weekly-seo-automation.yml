name: Weekly AI SEO & GEO Automation

on:
  schedule:
    # 매주 월요일 한국시간 06:00 (UTC 일요일 21:00)
    - cron: '0 21 * * 0'
  workflow_dispatch: # 수동 즉시 실행 트리거

permissions:
  contents: write

jobs:
  run-seo-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth requests

      - name: Run Weekly SEO & GEO Automation Pipeline
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python reports/seo_automations/weekly_seo_runner.py

      - name: Commit & Push Weekly Reports
        run: |
          git config --global user.name "antigravity-bot"
          git config --global user.email "bot@antigravity.ai"
          git add reports/seo_automations/
          git commit -m "chore(seo): automated weekly seo audit & drafts [skip ci]" || echo "No changes to commit"
          git push origin main
