name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'tutorial.html'
      - 'Index.md'
      - 'Index.docx'
      - '환영합니다!.md'
      - '환영합니다!.docx'
      - 'Wiki/**'
      - 'Schema/**'
      - 'Raw/**'
      - 'monsmecta_labels_85x40mm_final/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages assets only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            Wiki
            Schema
            Raw
            monsmecta_labels_85x40mm_final

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage static site directory
        run: |
          mkdir -p _site
          for f in index.html tutorial.html Index.md Index.docx "환영합니다!.md" "환영합니다!.docx"; do
            if [ -f "$f" ]; then
              cp "$f" _site/
            fi
          done
          for d in Wiki Schema Raw monsmecta_labels_85x40mm_final; do
            if [ -d "$d" ]; then
              cp -r "$d" _site/
            fi
          done
          echo "=== Staged _site summary ==="
          du -sh _site _site/*

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
